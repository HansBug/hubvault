name: Container Image

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - 'Dockerfile'
      - 'README.md'
      - 'README_zh.md'
      - 'docker/**'
      - 'hubvault/**'
      - 'requirements*.txt'
      - 'setup.py'
  push:
    paths:
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - 'Dockerfile'
      - 'README.md'
      - 'README_zh.md'
      - 'docker/**'
      - 'hubvault/**'
      - 'requirements*.txt'
      - 'setup.py'
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  smoke_test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/hubvault:ci

      - name: Smoke test startup and persistent repository volume
        shell: bash
        run: |
          set -euo pipefail
          volume_name="hubvault-smoke-data"
          cleanup() {
            docker rm -f hubvault-smoke >/dev/null 2>&1 || true
            docker volume rm -f "${volume_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "${volume_name}" >/dev/null

          docker run -d \
            --name hubvault-smoke \
            -e HUBVAULT_TOKEN_RW=ci-token \
            -e HUBVAULT_PORT=9480 \
            -v "${volume_name}:/data/repo" \
            -p 9480:9480 \
            local/hubvault:ci

          for _ in $(seq 1 30); do
            if curl -fsS \
              -H "Authorization: Bearer ci-token" \
              http://127.0.0.1:9480/api/v1/meta/service \
              > /tmp/hubvault-service.json; then
              break
            fi
            sleep 1
          done

          docker run --rm \
            -v "${volume_name}:/data/repo" \
            local/hubvault:ci \
            sh -c 'test -f /data/repo/FORMAT && test -f /data/repo/metadata.sqlite3'

          docker rm -f hubvault-smoke >/dev/null 2>&1 || true

          docker run -d \
            --name hubvault-smoke \
            -e HUBVAULT_TOKEN_RW=ci-token \
            -e HUBVAULT_INIT=0 \
            -e HUBVAULT_PORT=9480 \
            -v "${volume_name}:/data/repo" \
            -p 9480:9480 \
            local/hubvault:ci

          for _ in $(seq 1 30); do
            if curl -fsS \
              -H "Authorization: Bearer ci-token" \
              http://127.0.0.1:9480/api/v1/meta/service \
              > /tmp/hubvault-service.json; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/hubvault-service.json").read_text())
          assert payload["service"] == "hubvault"
          assert payload["mode"] == "frontend"
          assert payload["repo"]["default_branch"] == "main"
          assert payload["auth"]["can_write"] is True
          PY

  publish_ghcr:
    name: Publish Container to GHCR
    if: ${{ github.repository == 'HansBug/hubvault' && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs:
      - smoke_test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hansbug/hubvault
          flavor: |
            latest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_dockerhub:
    name: Publish Container to Docker Hub
    if: ${{ github.repository == 'HansBug/hubvault' && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs:
      - smoke_test
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect Docker Hub credentials
        id: dockerhub
        shell: bash
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hansbug/hubvault
          flavor: |
            latest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push image
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip Docker Hub publish when secrets are absent
        if: ${{ steps.dockerhub.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured; skipping Docker Hub publish."
